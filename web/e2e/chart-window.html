<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>图表大范围回归夹具（合成数据）</title>
<style>html,body,#app{margin:0;width:100%;height:100%;background:#131722;color:white}</style>
<div id="app"></div>
<script type="module">
  import { createApp, h, reactive } from 'vue'
  import '/src/styles.css'
  import ChartGroup from '/src/components/ChartGroup.vue'
  import ObjectTreePanel from '/src/components/ObjectTreePanel.vue'
  import { ChanPrimitive } from '/src/chart/chanPrimitive.ts'
  // Observe the real chart/primitive through its public attachment callback.
  const attached = ChanPrimitive.prototype.attached
  ChanPrimitive.prototype.attached = function (parameters) {
    window.chartWindowChart = parameters.chart
    window.chartWindowPrimitive = this
    attached.call(this, parameters)
  }
  const props = reactive(window.chartWindowProps)
  createApp({ render: () => window.centerModeFixture
    ? h('div', { style: 'display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%' }, [
      h(ChartGroup, props),
      h(ObjectTreePanel, { dataset: props.dataset, drawings: [], sources: [], strategySources: props.strategySources, selectedId: null,
        onPatchStrategy: (id, patch) => { props.strategySources = props.strategySources.map(s => s.source_id === id ? { ...s, ...patch } : s) },
      }),
    ]) : h(ChartGroup, props) }).mount('#app')
</script>
</html>
