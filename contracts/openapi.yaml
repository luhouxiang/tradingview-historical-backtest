          type: string
        algorithm_version:
          type: string
        source_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"

    AlgorithmDefinition:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/AlgorithmRef"
        - type: object
          required: [name, input_schema, parameter_schema, outputs, warmup, causal]
          properties:
            name:
              type: string
            input_schema:
              const: bars.v1
            parameter_schema:
              type: object
              additionalProperties: true
            outputs:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [name, display_name, pane, series_type]
                properties:
                  name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
                  display_name: {type: string, minLength: 1}
                  pane: {enum: [main, indicator]}
                  series_type: {enum: [line, histogram, semantic_objects]}
                  object_type: {enum: [fractal, bi, segment, zhongshu, segment_zhongshu, divergence, trade_point, strategy_state, stage_signal, trade_signal, chart_event]}
            warmup:
              type: object
              additionalProperties: false
              required: [kind, expression]
              properties:
                kind: {const: formula}
                expression: {type: string, minLength: 1}
            causal:
              const: true

    DatasetRef:
      type: object
      required: [dataset_id, data_revision, bars_path, meta_path]
      properties:
        dataset_id:
          type: string
        data_revision:
          type: string
        bars_path:
          type: string
        meta_path:
          type: string

    CalculationRequest:
      type: object
      additionalProperties: false
      required:
        - dataset_id
        - data_revision
        - algorithm
        - parameters
        - calculation_mode
      properties:
        dataset_id:
          type: string
        data_revision:
          type: string
        algorithm:
          $ref: "#/components/schemas/AlgorithmRef"
        parameters:
          type: object
          additionalProperties: true
        calculation_mode:
          enum: [full_history, causal_events]
        trace_id:
          type: string

    CalculationResults:
      type: object
      additionalProperties: false
      required:
        - request_id
        - job_id
        - cache_key
        - dataset_id
        - data_revision
        - algorithm
        - result_kind
        - coverage
        - checksum
      properties:
        request_id: {type: string}
        job_id: {type: string}
        cache_key:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        dataset_id: {type: string}
        data_revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        algorithm:
          $ref: "#/components/schemas/AlgorithmRef"
        result_kind:
          enum: [indicator, chan]
        coverage:
          type: object
          additionalProperties: false
          required: [first_bar_index, last_bar_index, returned_count]
          properties:
            first_bar_index: {type: integer, minimum: 0}
            last_bar_index: {type: integer, minimum: 0}
            returned_count: {type: integer, minimum: 0}
        checksum:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        bar_index:
          type: array
          items: {type: integer, minimum: 0}
        values:
          type: object
          additionalProperties:
            type: array
            items:
              type: [number, "null"]
        objects:
          $ref: "#/components/schemas/ChanObjects"
      allOf:
        - if:
            properties: {result_kind: {const: indicator}}
          then:
            required: [bar_index, values]
        - if:
            properties: {result_kind: {const: chan}}
          then:
            required: [objects]

