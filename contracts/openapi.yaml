        exit_bar_index: {type: integer, minimum: 0}
        exit_time: {type: integer}
        exit_price_i64: {type: integer}
        exit_signal_id: {type: string}
        exit_order_id: {type: string}
        quantity: {type: integer, minimum: 1}
        gross_pnl_i64: {type: integer}
        net_pnl_i64: {type: integer}
        commission_i64: {type: integer, minimum: 0}
        slippage_i64: {type: integer, minimum: 0}
        market_l0: {enum: [uptrend, downtrend, consolidation, higher_level_center_candidate, unknown]}
        center_phase: {enum: [consolidation, center_oscillation, migrating_up, migrating_down, unknown]}
        price_vs_center: {enum: [above, inside, below, unknown]}
        trigger_category: {enum: [B1, B2, B3, S1, S2, S3, class_buy_sell, other]}
        structure_object_id: {type: string}
        structure_object_revision: {type: integer, minimum: 0}
        attribution_reason_code: {type: string}

    PagedBacktestTrades:
      type: object
      additionalProperties: false
      required: [request_id, rows, next_cursor]
      properties:
        request_id: {type: string}
        rows: {type: array, items: {$ref: "#/components/schemas/BacktestTrade"}}
        next_cursor: {type: [string, "null"]}

    EquityRow:
      type: object
      additionalProperties: false
      required: [bar_index, timestamp_utc, equity_i64, cash_i64, available_i64, margin_i64, drawdown]
      properties:
        bar_index: {type: integer, minimum: 0}
        timestamp_utc: {type: integer}
        trading_day: {type: string}
        equity_i64: {type: integer}
        cash_i64: {type: integer}
        available_i64: {type: integer}
        margin_i64: {type: integer, minimum: 0}
        drawdown: {type: number, minimum: 0}

    PythonJobRequest:
      type: object
      required:
        - contract_version
        - request_id
        - trace_id
        - job_id
        - dataset
        - algorithm
        - parameters
        - calculation_mode
        - cache_key
        - output_path
      properties:
        contract_version:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        job_id:
          type: string
        run_id:
          type: string
        dataset:
          $ref: "#/components/schemas/DatasetRef"
        algorithm:
          $ref: "#/components/schemas/AlgorithmRef"
        parameters:
          type: object
          additionalProperties: true
        calculation_mode:
          enum: [full_history, causal_events]
        cache_key:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        range:
          type: object
          additionalProperties: true
        engine:
          type: object
          additionalProperties: true
        output_path:
          type: string

    CausalEvent:
      type: object
      required:
        - event_seq
        - known_at_bar_index
        - object_type
        - object_id
        - operation
        - object_revision
        - payload
      properties:
        event_seq:
          type: integer
        known_at_bar_index:
          type: integer
        object_type:
          type: string
        object_id:
          type: string
        operation:
          enum: [upsert, delete]
        object_revision:
          type: integer
        payload:
          type: object
          additionalProperties: true

    PagedRows:
      type: object
      required: [request_id, rows]
      properties:
        request_id:
          type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, "null"]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: "#/components/schemas/Error"
            - type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
