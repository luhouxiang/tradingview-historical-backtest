        max_drawdown: {type: number, minimum: 0}
        sharpe: {type: [number, "null"]}
        sharpe_reason: {type: [string, "null"]}
        annualized_volatility: {type: [number, "null"], minimum: 0}
        annualized_volatility_reason: {type: [string, "null"]}
        trading_day_count: {type: integer, minimum: 0}
        daily_return_count: {type: integer, minimum: 0}
        sharpe_annualization_factor: {type: integer, const: 252}
        trade_count: {type: integer, minimum: 0}
        win_rate: {type: [number, "null"], minimum: 0, maximum: 1}
        average_win_i64: {type: [integer, "null"]}
        average_loss_i64: {type: [integer, "null"]}
        profit_loss_ratio: {type: [number, "null"]}
        profit_factor: {type: [number, "null"]}
        expectancy_i64: {type: [number, "null"]}
        total_commission_i64: {type: integer, minimum: 0}
        total_slippage_i64: {type: integer, minimum: 0}
        requested_quantity: {type: integer, minimum: 0}
        filled_quantity: {type: integer, minimum: 0}
        fill_rate: {type: [number, "null"], minimum: 0, maximum: 1}
        risk_approved_count: {type: integer, minimum: 0}
        risk_reduced_count: {type: integer, minimum: 0}
        risk_blocked_count: {type: integer, minimum: 0}
        risk_kill_switch_count: {type: integer, minimum: 0}

    BacktestTrade:
      type: object
      additionalProperties: false
      required: [trade_id, side, entry_bar_index, entry_time, entry_price_i64, exit_bar_index, exit_time, exit_price_i64, quantity, gross_pnl_i64, net_pnl_i64, commission_i64, slippage_i64]
      properties:
        trade_id: {type: string}
        side: {enum: [long, short]}
        entry_bar_index: {type: integer, minimum: 0}
        entry_time: {type: integer}
        entry_price_i64: {type: integer}
        entry_signal_id: {type: string}
        entry_signal_known_at_bar_index: {type: integer, minimum: 0}
