openapi: 3.1.0
info:
  title: TradingView-like Historical Backtest API
  version: 1.0.0
  description: >
    Public Vue-to-Go API and loopback-only Go-to-Python control API.
    Large tabular data is exchanged through referenced Parquet files, not internal JSON bodies.
servers:
  - url: http://127.0.0.1:8080
    description: Go public API
security: []
tags:
  - name: System
  - name: Datasets
  - name: Jobs
  - name: Calculations
  - name: Replays
  - name: Backtests
  - name: StrategyResearch
  - name: Optimization
  - name: Workspaces
  - name: Logs
  - name: Python Internal
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 获取 Go 与 Python 健康状态
      responses:
        "200":
          description: Health of Go and Python engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/datasets/scan:
    post:
      tags: [Datasets]
      operationId: scanSourceFiles
      summary: 扫描历史源文件目录
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /api/v1/source-files:
    get:
      tags: [Datasets]
      operationId: listSourceFiles
      summary: 列出已识别和待修正的源文件
      responses:
        "200":
          description: Detected and unresolved source files
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items]
                properties:
                  request_id:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceFile"

  /api/v1/datasets/import:
    post:
      tags: [Datasets]
      operationId: importDataset
      summary: 创建历史数据导入任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/datasets/import-batch:
    post:
      tags: [Datasets]
      operationId: importDatasetsBatch
      summary: 顺序导入一批已扫描的本地历史文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBatchRequest"
      responses:
        "202":
          description: Batch import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: 获取数据集目录
      responses:
        "200":
          description: Catalog datasets
          content:
            application/json:
              schema:
                type: object
                required: [request_id, catalog_revision, datasets]
                properties:
                  request_id:
                    type: string
                  catalog_revision:
                    type: integer
                  datasets:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatasetSummary"

  /api/v1/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: 获取一个数据集的元数据
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Revision"
      responses:
        "200":
          description: Dataset metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/datasets/research-readiness:
    get:
      tags: [Datasets]
      operationId: getDatasetResearchReadiness
      summary: 获取单周期研究的数据覆盖、独立性和重叠区间门禁
      responses:
        "200":
          description: Dataset research readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetResearchReadiness"

  /api/v1/datasets/{dataset_id}/bars:
    get:
      tags: [Datasets]
      operationId: getBars
      summary: 按尾部或向左游标读取 K 线
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/Revision"
        - name: generation_id
          in: query
          required: true
          schema:
            type: string
        - name: tail
          in: query
          description: 首次读取尾部数量；与 before_bar_index 二选一，未提供游标时默认 3000
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 3000
        - name: before_bar_index
          in: query
          description: 返回 bar_index 严格小于此值的最近数据；不得与 tail 同时提供
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: before_bar_index 模式的返回上限
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1500
      responses:
        "200":
          description: Columnar K-line range in ascending bar_index order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarRangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 查询导入、扫描或计算等长任务状态
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 协作式取消长任务
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/algorithms:
    get:
      tags: [Calculations]
      operationId: listAlgorithms
      summary: 获取可用指标、缠论与策略定义
      responses:
        "200":
          description: Indicator, Chan and strategy definitions
          content:
            application/json:
              schema:
                type: object
                required: [request_id, algorithms]
                properties:
                  request_id:
                    type: string
                  algorithms:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlgorithmDefinition"

  /api/v1/calculations:
    post:
      tags: [Calculations]
      operationId: createCalculation
      summary: 创建或复用指标或缠论计算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
      responses:
        "200":
          description: Existing cache hit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "202":
          description: Calculation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /api/v1/calculations/{job_id}:
    get:
      tags: [Calculations]
      operationId: getCalculation
      summary: 查询计算状态
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /api/v1/calculations/{job_id}/cancel:
    post:
      tags: [Calculations]
      operationId: cancelCalculation
      summary: 取消计算
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Cancellation requested

  /api/v1/calculations/{job_id}/results:
    get:
      tags: [Calculations]
      operationId: getCalculationResults
      summary: 按范围读取指标或结构对象
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: from_bar_index
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: to_bar_index
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Dense indicator values or semantic object changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResults"

  /api/v1/replays:
    post:
      tags: [Replays]
      operationId: createReplay
      summary: 创建或复用因果回放事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: Existing replay cache hit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStatus"
        "202":
          description: Replay event generation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStatus"

  /api/v1/replays/{replay_id}:
    get:
      tags: [Replays]
      operationId: getReplay
      summary: 查询回放事件任务状态
      parameters:
        - $ref: "#/components/parameters/ReplayId"
      responses:
        "200":
          description: Replay metadata and status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStatus"

  /api/v1/replays/{replay_id}/events:
    get:
      tags: [Replays]
      operationId: getReplayEvents
      summary: 按已知时间范围读取因果事件
      parameters:
        - $ref: "#/components/parameters/ReplayId"
        - name: known_from_bar_index
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: known_to_bar_index
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Causal events ordered by event_seq
          content:
            application/json:
              schema:
                type: object
                required: [request_id, replay_id, known_from_bar_index, known_to_bar_index, event_count, checksum, events]
                properties:
                  request_id:
                    type: string
                  replay_id:
                    type: string
                  known_from_bar_index:
                    type: integer
                    minimum: 0
                  known_to_bar_index:
                    type: integer
                    minimum: 0
                  event_count:
                    type: integer
                    minimum: 0
                  checksum:
                    type: string
                    pattern: "^sha256:[0-9a-f]{64}$"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CausalEvent"

  /api/v1/backtests:
    post:
      tags: [Backtests]
      operationId: createBacktest
      summary: 创建正式回测运行
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRequest"
      responses:
        "202":
          description: Backtest accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"

  /api/v1/backtests/{run_id}:
    get:
      tags: [Backtests]
      operationId: getBacktest
      summary: 查询回测状态与清单
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run status and manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatus"

  /api/v1/backtests/{run_id}/cancel:
    post:
      tags: [Backtests]
      operationId: cancelBacktest
      summary: 取消回测运行
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancellation requested

  /api/v1/backtests/{run_id}/summary:
    get:
      tags: [Backtests]
      operationId: getBacktestSummary
      summary: 获取回测汇总
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Backtest aggregate metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestSummary"

  /api/v1/backtests/{run_id}/trades:
    get:
      tags: [Backtests]
      operationId: listBacktestTrades
      summary: 分页获取回测交易
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedBacktestTrades"

  /api/v1/backtests/{run_id}/equity:
    get:
      tags: [Backtests]
      operationId: getBacktestEquity
      summary: 获取回测权益曲线
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Equity curve rows
          content:
            application/json:
              schema:
                type: object
                required: [request_id, run_id, rows]
                properties:
                  request_id: {type: string}
                  run_id: {type: string}
                  rows:
                    type: array
                    items: {$ref: "#/components/schemas/EquityRow"}

  /api/v1/backtests/{run_id}/chart-events:
    get:
      tags: [Backtests]
      operationId: getBacktestChartEvents
      summary: 获取回测图上事件
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Trade and strategy overlays
          content:
            application/json:
              schema:
                type: object
                required: [request_id, run_id, events]
                properties:
                  request_id: {type: string}
                  run_id: {type: string}
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/CausalEvent"}

  /api/v1/strategy-comparisons:
    post:
      tags: [StrategyResearch]
      operationId: createStrategyComparison
      summary: Create a deterministic batch comparison of formal strategies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyComparisonRequest"
      responses:
        "202":
          description: Strategy comparison accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyComparisonAccepted"
    get:
      tags: [StrategyResearch]
      operationId: listStrategyComparisons
      summary: List completed strategy comparisons
      parameters:
        - in: query
          name: dataset_id
          schema: {type: string}
      responses:
        "200":
          description: Completed comparison manifests
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items]
                properties:
                  request_id: {type: string}
                  items:
                    type: array
                    items: {$ref: "./schemas/strategy-comparison-manifest.schema.json"}

  /api/v1/strategy-comparisons/{comparison_id}:
    get:
      tags: [StrategyResearch]
      operationId: getStrategyComparison
      summary: Get strategy comparison status and manifest
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      responses:
        "200":
          description: Comparison status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyComparisonStatus"

  /api/v1/strategy-comparisons/{comparison_id}/cancel:
    post:
      tags: [StrategyResearch]
      operationId: cancelStrategyComparison
      summary: Cancel a running strategy comparison
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      responses:
        "202":
          description: Cancellation requested

  /api/v1/strategy-comparisons/{comparison_id}/results:
    get:
      tags: [StrategyResearch]
      operationId: getStrategyComparisonResults
      summary: Get per-strategy batch results
      parameters:
        - $ref: "#/components/parameters/ComparisonId"
      responses:
        "200":
          description: Per-strategy results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyComparisonResults"

  /api/v1/research-studies:
    post:
      tags: [StrategyResearch]
      operationId: createResearchStudy
      summary: Create an immutable same-timeframe multi-dataset research study
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResearchStudyRequest"}
      responses:
        "202":
          description: Research study accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResearchStudyAccepted"}
    get:
      tags: [StrategyResearch]
      operationId: listResearchStudies
      summary: List completed research studies
      responses:
        "200":
          description: Completed research study manifests
          content:
            application/json:
              schema:
                type: object
                required: [request_id, items]
                properties:
                  request_id: {type: string}
                  items: {type: array, items: {$ref: "./schemas/research-study-manifest.schema.json"}}

  /api/v1/research-studies/{research_study_id}:
    get:
      tags: [StrategyResearch]
      operationId: getResearchStudy
      summary: Get research study status and manifest
      parameters:
        - $ref: "#/components/parameters/ResearchStudyId"
      responses:
        "200":
          description: Research study status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResearchStudyStatus"}

  /api/v1/research-studies/{research_study_id}/cancel:
    post:
      tags: [StrategyResearch]
      operationId: cancelResearchStudy
      summary: Cancel a running research study
      parameters:
        - $ref: "#/components/parameters/ResearchStudyId"
      responses:
        "202": {description: Cancellation requested}

  /api/v1/research-studies/{research_study_id}/resume:
    post:
      tags: [StrategyResearch]
      operationId: resumeResearchStudy
      summary: Resume an interrupted, cancelled, or failed research study from its journal
      parameters:
        - $ref: "#/components/parameters/ResearchStudyId"
      responses:
        "202":
          description: Research study resumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResearchStudyAccepted"}

  /api/v1/research-studies/{research_study_id}/results:
    get:
      tags: [StrategyResearch]
      operationId: getResearchStudyResults
      summary: Get per-dataset and independence-group-weighted research results
      parameters:
        - $ref: "#/components/parameters/ResearchStudyId"
      responses:
        "200":
          description: Research study results
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResearchStudyResults"}

  /api/v1/studies:
    post:
      tags: [Optimization]
      operationId: createStudy
      summary: Create a deterministic parameter optimization study
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyRequest"
      responses:
        "202":
          description: Study accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAccepted"

  /api/v1/studies/{study_id}:
    get:
      tags: [Optimization]
      operationId: getStudy
      summary: Get study status and final manifest
      parameters:
        - $ref: "#/components/parameters/StudyId"
      responses:
        "200":
          description: Study status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyStatus"

  /api/v1/studies/{study_id}/cancel:
    post:
      tags: [Optimization]
      operationId: cancelStudy
      summary: Cancel a running study
      parameters:
        - $ref: "#/components/parameters/StudyId"
      responses:
        "202":
          description: Cancellation requested

  /api/v1/studies/{study_id}/evaluations:
    get:
      tags: [Optimization]
      operationId: listStudyEvaluations
      summary: Get ranked train and validation evaluations
      parameters:
        - $ref: "#/components/parameters/StudyId"
      responses:
        "200":
          description: Study evaluations and stability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyEvaluations"

  /api/v1/workspaces/{profile_id}/layouts/{layout_id}:
    get:
      tags: [Workspaces]
      operationId: getLayout
      summary: 读取图表布局
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LayoutId"
      responses:
        "200":
          description: Layout document
          content:
            application/json:
              schema:
                $ref: "./schemas/layout.schema.json"
    put:
      tags: [Workspaces]
      operationId: putLayout
      summary: 带修订号保存图表布局
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LayoutId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/layout.schema.json"
      responses:
        "200":
          description: Saved layout
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{profile_id}/strategy-source-config:
    get:
      tags: [Workspaces]
      operationId: getStrategySourceConfig
      summary: 读取界面动态修改的 StrategySource 显示配置
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: StrategySource dynamic configuration document
          content:
            application/json:
              schema:
                $ref: "./schemas/strategy-source-config.schema.json"
    put:
      tags: [Workspaces]
      operationId: putStrategySourceConfig
      summary: 带修订号保存界面动态修改的 StrategySource 显示配置
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/strategy-source-config.schema.json"
      responses:
        "200":
          description: Saved StrategySource dynamic configuration
          content:
            application/json:
              schema:
                $ref: "./schemas/strategy-source-config.schema.json"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workspaces/{profile_id}/drawings/{layout_id}/{dataset_id}:
    get:
      tags: [Workspaces]
      operationId: getDrawings
      summary: 读取用户绘图
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LayoutId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Drawing document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags: [Workspaces]
      operationId: putDrawings
      summary: 带修订号保存用户绘图
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LayoutId"
        - $ref: "#/components/parameters/DatasetId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/drawings.schema.json"
      responses:
        "200":
          description: Saved drawings
          content:
            application/json:
              schema:
                $ref: "./schemas/drawings.schema.json"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/client-logs:
    post:
      tags: [Logs]
      operationId: ingestClientLogs
      summary: 接收 Vue 客户端日志批次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "./schemas/log-event.schema.json"
      responses:
        "202":
          description: Batch accepted

  /internal/v1/health:
    get:
      tags: [Python Internal]
      operationId: getPythonHealth
      summary: 获取 Python 引擎健康状态
      servers:
        - url: http://127.0.0.1:8091
      responses:
        "200":
          description: Python engine health and contract version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /internal/v1/algorithms:
    get:
      tags: [Python Internal]
      operationId: listPythonAlgorithms
      summary: 获取 Python 算法定义
      servers:
        - url: http://127.0.0.1:8091
      responses:
        "200":
          description: Python algorithm definitions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/job-submissions/{job_kind}:
    post:
      tags: [Python Internal]
      operationId: submitPythonJob
      summary: 向 Python 提交计算、回放或回测任务
      servers:
        - url: http://127.0.0.1:8091
      parameters:
        - name: job_kind
          in: path
          required: true
          schema:
            enum: [calculation, replay, backtest, optimization, comparison, research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PythonJobRequest"
      responses:
        "202":
          description: Python job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /internal/v1/jobs/{job_id}:
    get:
      tags: [Python Internal]
      operationId: getPythonJob
      summary: 查询 Python 任务状态
      servers:
        - url: http://127.0.0.1:8091
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Python job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

  /internal/v1/jobs/{job_id}/cancel:
    post:
      tags: [Python Internal]
      operationId: cancelPythonJob
      summary: 取消 Python 任务
      servers:
        - url: http://127.0.0.1:8091
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Cancellation requested

components:
  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    Revision:
      name: revision
      in: query
      required: true
      schema:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    ReplayId:
      name: replay_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ComparisonId:
      name: comparison_id
      in: path
      required: true
      schema:
        type: string
    ResearchStudyId:
      name: research_study_id
      in: path
      required: true
      schema:
        type: string
    StudyId:
      name: study_id
      in: path
      required: true
      schema:
        type: string
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
    LayoutId:
      name: layout_id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Revision or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Invalid domain input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, contract_version, services]
      properties:
        status:
          enum: [ok, degraded, unavailable]
        contract_version:
          type: string
        services:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                enum: [ok, degraded, unavailable]
              version:
                type: string

    SourceFile:
      type: object
      required: [source_file_id, path, status]
      properties:
        source_file_id:
          type: string
        path:
          type: string
        status:
          enum: [detected, needs_mapping, importable, imported, rejected]
        detected:
          type: object
          additionalProperties: true
        issues:
          type: array
          items:
            type: object
            additionalProperties: true

    ImportRequest:
      type: object
      required:
        - source_file_id
        - importer_id
        - exchange
        - instrument
        - timeframe
        - date_semantics
        - timezone
      properties:
        source_file_id:
          type: string
        importer_id:
          const: tdx_txt_v1
        exchange:
          type: string
        instrument:
          type: string
        timeframe:
          type: string
        date_semantics:
          enum: [trading_day, calendar_date]
        timezone:
          type: string
        independence_group:
          type: string
          pattern: "^[A-Z0-9_]+\\.[A-Z0-9_]+$"
        timestamp_semantics:
          enum: [bar_start, bar_end]
        options:
          type: object
          additionalProperties: true

    ImportBatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImportRequest"

    DatasetSummary:
      type: object
      required:
        - dataset_id
        - active_revision
        - instrument
        - timeframe
        - bar_count
        - first_timestamp_utc
        - last_timestamp_utc
        - status
      properties:
        dataset_id:
          type: string
        active_revision:
          type: string
        instrument:
          type: string
        timeframe:
          type: string
        bar_count:
          type: integer
        first_timestamp_utc:
          type: integer
        last_timestamp_utc:
          type: integer
        first_trading_day:
          type: string
        last_trading_day:
          type: string
        trading_day_count:
          type: integer
          minimum: 1
        independence_group:
          type: string
        status:
          enum: [ready, importing, invalid]

    DatasetResearchReadiness:
      type: object
      additionalProperties: false
      required: [request_id, status, required_trading_days, required_independence_groups, eligible_independence_group_count, datasets, reasons]
      properties:
        request_id: {type: string}
        status: {enum: [exploratory, certification_ready]}
        required_trading_days: {type: integer, const: 504}
        required_independence_groups: {type: integer, const: 3}
        eligible_independence_group_count: {type: integer, minimum: 0}
        datasets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dataset_id, data_revision, independence_group, trading_day_count, eligible, overlapping_dataset_ids]
            properties:
              dataset_id: {type: string}
              data_revision: {type: string}
              independence_group: {type: string}
              trading_day_count: {type: integer, minimum: 0}
              eligible: {type: boolean}
              overlapping_dataset_ids: {type: array, items: {type: string}}
        reasons: {type: array, items: {type: string}}

    BarColumns:
      type: object
      required:
        - bar_index
        - timestamp_utc
        - open_i64
        - high_i64
        - low_i64
        - close_i64
        - volume
      properties:
        bar_index:
          type: array
          items: {type: integer}
        timestamp_utc:
          type: array
          items: {type: integer}
        open_i64:
          type: array
          items: {type: integer}
        high_i64:
          type: array
          items: {type: integer}
        low_i64:
          type: array
          items: {type: integer}
        close_i64:
          type: array
          items: {type: integer}
        volume:
          type: array
          items: {type: integer}
        open_interest:
          type: array
          items:
            type: [integer, "null"]

    BarRangeResponse:
      type: object
      required:
        - request_id
        - dataset_id
        - data_revision
        - generation_id
        - price_scale
        - coverage
        - has_more_before
        - checksum
        - bars
      properties:
        request_id:
          type: string
        dataset_id:
          type: string
        data_revision:
          type: string
        generation_id:
          type: string
        price_scale:
          type: integer
        coverage:
          type: object
          required: [first_bar_index, last_bar_index]
          properties:
            first_bar_index: {type: integer}
            last_bar_index: {type: integer}
        has_more_before:
          type: boolean
        checksum:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        bars:
          $ref: "#/components/schemas/BarColumns"

    AlgorithmRef:
      type: object
      required: [kind, algorithm_id, algorithm_version, source_hash]
      properties:
        kind:
          enum: [indicator, chan, strategy, risk_filter]
        algorithm_id:
          type: string
        algorithm_version:
          type: string
        source_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"

    AlgorithmDefinition:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/AlgorithmRef"
        - type: object
          required: [name, input_schema, parameter_schema, outputs, warmup, causal]
          properties:
            name:
              type: string
            input_schema:
              const: bars.v1
            parameter_schema:
              type: object
              additionalProperties: true
            outputs:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [name, display_name, pane, series_type]
                properties:
                  name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
                  display_name: {type: string, minLength: 1}
                  pane: {enum: [main, indicator]}
                  series_type: {enum: [line, histogram, semantic_objects]}
                  object_type: {enum: [processed_bar, fractal, bi, bi_state, segment, zhongshu, segment_zhongshu, level_center, level_movement, movement_state, center_monitor, divergence, trade_point, strategy_state, stage_signal, trade_signal, chart_event, risk_decision]}
            warmup:
              type: object
              additionalProperties: false
              required: [kind, expression]
              properties:
                kind: {const: formula}
                expression: {type: string, minLength: 1}
            causal:
              const: true
            comparison_eligible:
              type: boolean
            research_role:
              enum: [formal_strategy, example_strategy, auxiliary_non_trading, risk_filter]
            strategy_family:
              type: string
            catalog_algorithm_ids:
              type: array
              uniqueItems: true
              items: {type: string, pattern: "^ALG-[A-Z]+-[0-9]{3}$"}

    DatasetRef:
      type: object
      required: [dataset_id, data_revision, bars_path, meta_path]
      properties:
        dataset_id:
          type: string
        data_revision:
          type: string
        bars_path:
          type: string
        meta_path:
          type: string

    CalculationRequest:
      type: object
      additionalProperties: false
      required:
        - dataset_id
        - data_revision
        - algorithm
        - parameters
        - calculation_mode
      properties:
        dataset_id:
          type: string
        data_revision:
          type: string
        algorithm:
          $ref: "#/components/schemas/AlgorithmRef"
        parameters:
          type: object
          additionalProperties: true
        calculation_mode:
          enum: [full_history, causal_events]
        trace_id:
          type: string

    CalculationResults:
      type: object
      additionalProperties: false
      required:
        - request_id
        - job_id
        - cache_key
        - dataset_id
        - data_revision
        - algorithm
        - result_kind
        - coverage
        - checksum
      properties:
        request_id: {type: string}
        job_id: {type: string}
        cache_key:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        dataset_id: {type: string}
        data_revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        algorithm:
          $ref: "#/components/schemas/AlgorithmRef"
        result_kind:
          enum: [indicator, chan]
        coverage:
          type: object
          additionalProperties: false
          required: [first_bar_index, last_bar_index, returned_count]
          properties:
            first_bar_index: {type: integer, minimum: 0}
            last_bar_index: {type: integer, minimum: 0}
            returned_count: {type: integer, minimum: 0}
        checksum:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        bar_index:
          type: array
          items: {type: integer, minimum: 0}
        values:
          type: object
          additionalProperties:
            type: array
            items:
              type: [number, "null"]
        objects:
          $ref: "#/components/schemas/ChanObjects"
      allOf:
        - if:
            properties: {result_kind: {const: indicator}}
          then:
            required: [bar_index, values]
        - if:
            properties: {result_kind: {const: chan}}
          then:
            required: [objects]

    ChanObjects:
      type: object
      additionalProperties: false
      required: [processed_bars, fractals, bi, bi_states, segments, zhongshu, segment_zhongshu, level_centers, level_movements, movement_states, center_monitors, divergences, trade_points]
      properties:
        processed_bars:
          type: array
          items: {$ref: "#/components/schemas/ChanProcessedBar"}
        fractals:
          type: array
          items: {$ref: "#/components/schemas/ChanFractal"}
        bi:
          type: array
          items: {$ref: "#/components/schemas/ChanLineObject"}
        bi_states:
          type: array
          items: {$ref: "#/components/schemas/ChanBiState"}
        segments:
          type: array
          items: {$ref: "#/components/schemas/ChanLineObject"}
        zhongshu:
          type: array
          items: {$ref: "#/components/schemas/ChanZhongshu"}
        segment_zhongshu:
          type: array
          items: {$ref: "#/components/schemas/ChanZhongshu"}
        level_centers:
          type: array
          items: {$ref: "#/components/schemas/ChanLevelCenter"}
        level_movements:
          type: array
          items: {$ref: "#/components/schemas/ChanLevelMovement"}
        movement_states:
          type: array
          items: {$ref: "#/components/schemas/ChanMovementState"}
        center_monitors:
          type: array
          items: {$ref: "#/components/schemas/ChanCenterMonitor"}
        divergences:
          type: array
          items: {$ref: "#/components/schemas/ChanSignalPoint"}
        trade_points:
          type: array
          items: {$ref: "#/components/schemas/ChanSignalPoint"}

    ChanProcessedBar:
      type: object
      additionalProperties: false
      required: [object_id, normalized_index, start_bar_index, start_time, end_bar_index, end_time, open_i64, high_i64, low_i64, close_i64, high_source_bar_index, low_source_bar_index, direction, source_bar_indices, status, sealed_at_bar_index, catalog_event, known_at_bar_index, object_revision]
      properties:
        object_id: {type: string, minLength: 1}
        normalized_index: {type: integer, minimum: 0}
        start_bar_index: {type: integer, minimum: 0}
        start_time: {type: integer}
        end_bar_index: {type: integer, minimum: 0}
        end_time: {type: integer}
        open_i64: {type: integer}
        high_i64: {type: integer}
        low_i64: {type: integer}
        close_i64: {type: integer}
        high_source_bar_index: {type: integer, minimum: 0}
        low_source_bar_index: {type: integer, minimum: 0}
        direction: {enum: [up, down, unknown]}
        source_bar_indices:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0}
        status: {enum: [forming, sealed]}
        sealed_at_bar_index: {type: [integer, "null"], minimum: 0}
        catalog_event: {enum: [processed_bar, processed_bar_revision]}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanFractal:
      type: object
      additionalProperties: false
      required:
        - object_id
        - bar_index
        - time
        - price_i64
        - zone_low_i64
        - zone_high_i64
        - extreme_source_bar_index
        - fractal_type
        - status
        - invalidation_reason
        - aux_strength
        - strength_reason
        - catalog_algorithm_id
        - strength_semantic_namespace
        - standard_signal
        - execution_allowed
        - confirmed
        - confirmed_at_bar_index
        - known_at_bar_index
        - object_revision
      properties:
        object_id: {type: string, minLength: 1}
        bar_index: {type: integer, minimum: 0}
        time: {type: integer}
        price_i64: {type: integer}
        zone_low_i64: {type: integer}
        zone_high_i64: {type: integer}
        extreme_source_bar_index: {type: integer, minimum: 0}
        fractal_type: {enum: [top, bottom]}
        status: {enum: [candidate, confirmed, invalidated]}
        invalidation_reason: {type: [string, "null"]}
        aux_strength: {enum: [strong_reversal, unclassified]}
        strength_reason: {type: string, minLength: 1}
        catalog_algorithm_id: {const: ALG-GEO-002}
        strength_semantic_namespace: {const: auxiliary}
        standard_signal: {const: false}
        execution_allowed: {const: false}
        confirmed: {type: boolean}
        confirmed_at_bar_index: {type: [integer, "null"], minimum: 0}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanLineObject:
      type: object
      additionalProperties: false
      required:
        - object_id
        - start_bar_index
        - start_time
        - start_price_i64
        - start_extreme_source_bar_index
        - end_bar_index
        - end_time
        - end_price_i64
        - end_extreme_source_bar_index
        - direction
        - status
        - invalidation_reason
        - catalog_algorithm_id
        - confirmed
        - confirmed_at_bar_index
        - known_at_bar_index
        - object_revision
      properties:
        object_id: {type: string, minLength: 1}
        start_bar_index: {type: integer, minimum: 0}
        start_time: {type: integer}
        start_price_i64: {type: integer}
        start_extreme_source_bar_index: {type: integer, minimum: 0}
        end_bar_index: {type: integer, minimum: 0}
        end_time: {type: integer}
        end_price_i64: {type: integer}
        end_extreme_source_bar_index: {type: integer, minimum: 0}
        direction: {enum: [up, down]}
        status: {enum: [candidate, confirmed, invalidated]}
        invalidation_reason: {type: [string, "null"]}
        catalog_algorithm_id: {enum: [ALG-GEO-003, ALG-GEO-004]}
        confirmed: {type: boolean}
        confirmed_at_bar_index: {type: [integer, "null"], minimum: 0}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanBiState:
      type: object
      additionalProperties: false
      required: [object_id, bar_index, time, price_i64, state, direction, anchor_fractal_id, candidate_object_id, trigger, catalog_algorithm_id, known_at_bar_index, object_revision]
      properties:
        object_id: {type: string, minLength: 1}
        bar_index: {type: integer, minimum: 0}
        time: {type: integer}
        price_i64: {type: integer}
        state: {enum: [SEEK_FIRST_FRACTAL, UP_EXTENDING, TOP_FORMING, DOWN_EXTENDING, BOTTOM_FORMING]}
        direction: {type: [string, "null"], enum: [up, down, null]}
        anchor_fractal_id: {type: [string, "null"]}
        candidate_object_id: {type: [string, "null"]}
        trigger: {enum: [initial, processed_bar_update, first_fractal_confirmed, fractal_confirmed, candidate_started, candidate_revised, candidate_invalidated, bi_confirmed]}
        catalog_algorithm_id: {const: ALG-GEO-003}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanZhongshu:
      type: object
      additionalProperties: false
      required: [object_id, start_bar_index, start_time, end_bar_index, end_time, zg_i64, zd_i64, gg_i64, dd_i64, z_i64, analysis_level, component_kind, component_count, confirmed, confirmed_at_bar_index, status, leave_direction, known_at_bar_index, object_revision]
      properties:
        object_id: {type: string, minLength: 1}
        start_bar_index: {type: integer, minimum: 0}
        start_time: {type: integer}
        end_bar_index: {type: integer, minimum: 0}
        end_time: {type: integer}
        zg_i64: {type: integer}
        zd_i64: {type: integer}
        gg_i64: {type: integer}
        dd_i64: {type: integer}
        z_i64: {type: integer}
        analysis_level: {type: string, minLength: 1}
        component_kind: {type: string, enum: [bi, segment]}
        component_count: {type: integer, minimum: 3}
        confirmed: {type: boolean}
        confirmed_at_bar_index: {type: [integer, "null"], minimum: 0}
        status: {type: string, enum: [confirmed, extended, left]}
        leave_direction: {type: [string, "null"], enum: [up, down, null]}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanMovementState:
      type: object
      additionalProperties: false
      required: [object_id, start_bar_index, start_time, end_bar_index, end_time, price_i64, state_type, direction, analysis_level, reference_object_id, confirmed, confirmed_at_bar_index, known_at_bar_index, object_revision]
      properties:
        object_id: {type: string, minLength: 1}
        start_bar_index: {type: integer, minimum: 0}
        start_time: {type: integer}
        end_bar_index: {type: integer, minimum: 0}
        end_time: {type: integer}
        price_i64: {type: integer}
        state_type: {type: string, enum: [consolidation, centre_oscillation, centre_migration_up, centre_migration_down]}
        direction: {type: [string, "null"], enum: [up, down, null]}
        analysis_level: {type: string, minLength: 1}
        reference_object_id: {type: string, minLength: 1}
        confirmed: {type: boolean}
        confirmed_at_bar_index: {type: [integer, "null"], minimum: 0}
        known_at_bar_index: {type: integer, minimum: 0}
        object_revision: {type: integer, minimum: 1}

    ChanLevelCenter:
      type: object
      additionalProperties: false
      required: [object_id, level_id, parent_level_id, start_bar_index, start_time, end_bar_index, end_time, zd_i64, zg_i64, dd_i64, gg_i64, component_kind, component_object_ids, source_center_ids, status, promotion_reason, promoted_from_center_id, catalog_event, catalog_algorithm_id, confirmed, confirmed_at_bar_index, known_at_bar_index, object_revision]
      properties:
        object_id: {type: string, minLength: 1}
        level_id: {type: string, pattern: "^L[1-9][0-9]*$"}
        parent_level_id: {type: string, pattern: "^L[0-9]+$"}
        start_bar_index: {type: integer, minimum: 0}
        start_time: {type: integer}
        end_bar_index: {type: integer, minimum: 0}
        end_time: {type: integer}
        zd_i64: {type: integer}
        zg_i64: {type: integer}
        dd_i64: {type: integer}
        gg_i64: {type: integer}
        component_kind: {enum: [segment, sublevel_movement]}
        component_object_ids:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        source_center_ids:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        status: {enum: [candidate, confirmed, extended, terminated, promoted, superseded]}
