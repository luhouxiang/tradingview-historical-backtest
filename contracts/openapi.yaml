        completed_dataset_count: {type: integer, minimum: 0}
        failed_dataset_count: {type: integer, minimum: 0}
        independence_group_count: {type: integer, minimum: 0}
        eligible_independence_group_count: {type: integer, minimum: 0}
        data_status: {enum: [exploratory, certification_ready]}
        daily_return_count: {type: integer, minimum: 0}
        total_trade_count: {type: integer, minimum: 0}
        total_return: {type: number}
        annualized_return: {type: [number, "null"]}
        sharpe: {type: [number, "null"]}
        annualized_volatility: {type: [number, "null"]}
        max_drawdown: {type: number, minimum: 0}
        median_dataset_return: {type: [number, "null"]}
        worst_dataset_id: {type: [string, "null"]}
        worst_dataset_return: {type: [number, "null"]}
        profitable_dataset_ratio: {type: [number, "null"], minimum: 0, maximum: 1}
        worst_dataset_max_drawdown: {type: number, minimum: 0}
        walk_forward_fold_count: {type: integer, minimum: 0}
        completed_walk_forward_fold_count: {type: integer, minimum: 0}
        profitable_fold_ratio: {type: [number, "null"], minimum: 0, maximum: 1}
        worst_fold_max_drawdown: {type: [number, "null"], minimum: 0}
        out_of_sample_trade_count: {type: integer, minimum: 0}
        certification_trade_count: {type: number, minimum: 0}
        out_of_sample_expectancy_i64: {type: [number, "null"]}
        minimum_completed_folds_per_group: {type: integer, minimum: 0}
        minimum_studied_trading_days_per_group: {type: integer, minimum: 0}
        parameter_stability: {type: [number, "null"], minimum: 0, maximum: 1}
        stress_scenarios:
          type: array
          items: {$ref: "#/components/schemas/StressScenarioResult"}
        first_failure_scenario: {type: [string, "null"]}
        attempted_parameter_combinations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [combination_id, parameters, attempt_count, completed_count]
            properties:
              combination_id: {type: string}
              parameters: {type: object, additionalProperties: true}
              attempt_count: {type: integer, minimum: 0}
              completed_count: {type: integer, minimum: 0}
        statistical_evidence: {type: object, additionalProperties: true}
        certification: {$ref: "#/components/schemas/ResearchCertification"}

    StressScenarioResult:
      type: object
      additionalProperties: false
      required: [scenario_id, status, cost_multiplier, additional_slippage_ticks, additional_delay_bars, fill_mode, completed_run_count, failed_run_count, requested_quantity, filled_quantity, fill_rate]
      properties:
        scenario_id: {type: string}
        status: {enum: [completed, failed]}
        cost_multiplier: {type: number, minimum: 0}
        additional_slippage_ticks: {type: number, minimum: 0}
        additional_delay_bars: {type: integer, minimum: 0}
        max_volume_participation_rate: {type: [number, "null"], exclusiveMinimum: 0, maximum: 1}
        fill_mode: {enum: [unlimited, volume_cap_ioc]}
        completed_run_count: {type: integer, minimum: 0}
        failed_run_count: {type: integer, minimum: 0}
        daily_return_count: {type: integer, minimum: 0}
        total_return: {type: [number, "null"]}
        max_drawdown: {type: [number, "null"], minimum: 0}
        trade_count: {type: integer, minimum: 0}
        requested_quantity: {type: integer, minimum: 0}
        filled_quantity: {type: integer, minimum: 0}
        fill_rate: {type: [number, "null"], minimum: 0, maximum: 1}
        return_degradation: {type: [number, "null"]}
        drawdown_degradation: {type: [number, "null"]}
        fill_rate_degradation: {type: [number, "null"]}
        failure_reason: {type: [string, "null"]}

    ResearchCertification:
      type: object
      additionalProperties: false
      required: [rules_version, tier, reliable_candidate_is_historical_only, research_candidate_passed, reliable_candidate_passed, reasons, evidence_matrix]
      properties:
        rules_version: {type: string}
        tier: {enum: [exploratory, research_candidate, reliable_candidate]}
        reliable_candidate_is_historical_only: {const: true}
        research_candidate_passed: {type: boolean}
        reliable_candidate_passed: {type: boolean}
        reasons: {type: array, items: {type: string}}
        evidence_matrix:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [gate_id, required_for, passed, actual, threshold, reason]
            properties:
              gate_id: {type: string}
              required_for: {enum: [research_candidate, reliable_candidate]}
              passed: {type: boolean}
              actual: {}
              threshold: {}
              reason: {type: string}

    ResearchStudyResults:
      type: object
      additionalProperties: false
      required: [request_id, research_study_id, items, aggregate]
      properties:
        request_id: {type: string}
        research_study_id: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/ResearchStudyDatasetResult"}}
        aggregate: {$ref: "#/components/schemas/ResearchStudyAggregate"}

    StudyRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, data_revision, strategy, base_parameters, search_space, objectives, constraints, search, ranges, execution, capital]
      properties:
        dataset_id: {type: string}
        data_revision: {type: string}
        strategy: {$ref: "#/components/schemas/AlgorithmRef"}
        base_parameters:
          type: object
          additionalProperties: true
        search_space:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/SearchParameter"}
        objectives:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/StudyObjective"}
        constraints:
          type: array
          items: {$ref: "#/components/schemas/StudyConstraint"}
        search:
          $ref: "#/components/schemas/SearchConfig"
        ranges:
          type: object
          additionalProperties: false
          required: [train, validation]
          properties:
            train: {$ref: "#/components/schemas/StudyRange"}
            validation: {$ref: "#/components/schemas/StudyRange"}
        execution:
          type: object
          additionalProperties: true
        capital:
          type: object
          additionalProperties: true
        risk_overlay:
          $ref: "#/components/schemas/RiskOverlay"
        trace_id: {type: string}

    SearchParameter:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: {type: string, minLength: 1}
        type: {enum: [integer, number, boolean, string]}
        minimum: {type: number}
        maximum: {type: number}
        step: {type: number, exclusiveMinimum: 0}
        candidates:
          type: array
          minItems: 1
          items: {}
    StudyObjective:
      type: object
      additionalProperties: false
      required: [metric, direction]
      properties:
        metric: {enum: [total_return, sharpe, max_drawdown, win_rate, trade_count, profit_factor, expectancy_i64]}
        direction: {enum: [maximize, minimize]}

    StudyConstraint:
      type: object
      additionalProperties: false
      required: [metric, operator, value]
      properties:
        metric: {enum: [total_return, sharpe, max_drawdown, win_rate, trade_count, profit_factor, expectancy_i64]}
        operator: {enum: [">=", "<="]}
        value: {type: number}

    SearchConfig:
      type: object
      additionalProperties: false
      required: [method, budget, random_seed]
      properties:
        method: {enum: [grid, random]}
        budget: {type: integer, minimum: 1, maximum: 100}
        random_seed: {type: integer}

    StudyRange:
      type: object
      additionalProperties: false
      required: [from_bar_index, to_bar_index, warmup_from_bar_index]
      properties:
        from_bar_index: {type: integer, minimum: 0}
        to_bar_index: {type: integer, minimum: 0}
        warmup_from_bar_index: {type: integer, minimum: 0}

    StudyAccepted:
      type: object
      additionalProperties: false
      required: [request_id, study_id, status]
      properties:
        request_id: {type: string}
        study_id: {type: string}
        status: {const: queued}

    StudyStatus:
      type: object
      additionalProperties: false
      required: [request_id, study_id, status, progress]
      properties:
        request_id: {type: string}
        study_id: {type: string}
        status: {enum: [queued, running, cancelling, completed, failed, cancelled, interrupted]}
        progress: {type: number, minimum: 0, maximum: 1}
        result_ref: {type: string}
        manifest: {$ref: "./schemas/study-manifest.schema.json"}
        error: {$ref: "#/components/schemas/Error"}

    StudyEvaluation:
      type: object
      additionalProperties: false
      required: [evaluation_index, parameters, constraints_satisfied, status, train_run_id, train_run_signature, validation_run_id, validation_run_signature, train_metrics, validation_metrics, train_rank, validation_rank]
      properties:
        evaluation_index: {type: integer, minimum: 0}
        parameters: {type: object, additionalProperties: true}
        constraints_satisfied: {type: boolean}
        status: {const: completed}
        train_run_id: {type: string}
        train_run_signature: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        validation_run_id: {type: string}
        validation_run_signature: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        train_metrics: {type: object, additionalProperties: true}
        validation_metrics: {type: object, additionalProperties: true}
        train_rank: {type: integer, minimum: 1}
        validation_rank: {type: integer, minimum: 1}

    StudyEvaluations:
      type: object
      additionalProperties: false
      required: [request_id, study_id, evaluations, stability]
      properties:
        request_id: {type: string}
        study_id: {type: string}
        evaluations:
          type: array
          items: {$ref: "#/components/schemas/StudyEvaluation"}
        stability:
          type: object
          additionalProperties: true

    JobAccepted:
      type: object
      required: [request_id, job_id, status]
      properties:
        request_id:
          type: string
        job_id:
          type: string
        status:
          const: queued

    JobStatus:
      type: object
      required: [request_id, job_id, status, progress]
      properties:
        request_id:
          type: string
        job_id:
          type: string
        status:
          enum: [queued, running, cancelling, completed, failed, cancelled, interrupted]
        progress:
          type: number
          minimum: 0
          maximum: 1
        result_ref:
          type: string
        error:
          $ref: "#/components/schemas/Error"

    RunAccepted:
      type: object
      required: [request_id, run_id, run_signature, status]
      properties:
        request_id:
          type: string
        run_id:
          type: string
        run_signature:
          type: string
        status:
          const: queued

    RunStatus:
      type: object
      required: [request_id, run_id, run_signature, status, progress]
      properties:
        request_id:
          type: string
        run_id:
          type: string
        run_signature:
          type: string
        status:
          enum: [queued, running, cancelling, completed, failed, cancelled, interrupted]
        progress:
          type: number
          minimum: 0
          maximum: 1
        manifest:
          $ref: "./schemas/run-manifest.schema.json"
        error:
          $ref: "#/components/schemas/Error"

    BacktestSummary:
      type: object
      additionalProperties: true
      required: [request_id, run_id, total_return, max_drawdown, trade_count, win_rate, total_commission_i64, total_slippage_i64, risk_approved_count, risk_reduced_count, risk_blocked_count, risk_kill_switch_count]
