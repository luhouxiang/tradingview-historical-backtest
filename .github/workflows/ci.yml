name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python development tools
        run: python -m pip install -r python/requirements-dev.lock
      - name: Install Web dependencies
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Go checks
        run: |
          test "$(go version | awk '{print $3}')" = "go1.25.7"
          go test ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
      - name: Python checks
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
      - name: Contract and Web checks
        working-directory: web
        run: |
          npm run contracts:validate
          npm run contracts:generate
          npm run contracts:bundle
          cd ..
          go generate ./internal/api
          git diff --exit-code -- contracts/generated internal/api/generated web/src/types/generated
          cd web
          npm run typecheck
          npm run test
          npm run build

  browser-release-gate:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked runtime and browser dependencies
        shell: pwsh
        run: |
          python -m pip install -r python/requirements.lock
          npm --prefix web ci --no-audit --no-fund
          Push-Location web
          npx playwright install chromium
          Pop-Location
      - name: Real full-stack browser acceptance
        shell: pwsh
        run: |
          $env:TVBT_PYTHON = (Get-Command python).Source
          ./scripts/accept-milestone13c.ps1 -SkipBrowserInstall
      - name: Build and smoke-test the Windows release archive
        shell: pwsh
        run: |
          $release = (./scripts/build-release.ps1 | Select-Object -Last 1) | ConvertFrom-Json
          ./scripts/smoke-release.ps1 -Archive $release.archive
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: milestone13c-browser-evidence
          path: |
            web/playwright-report/
            web/test-results/
            bin/e2e-runtime/logs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: tvbt-windows-release
          path: bin/release/*.zip
          if-no-files-found: error
