schema_version: 1

app:
  name: tvbt
  timezone: Asia/Shanghai
  contract_version: 1.0.0

server:
  listen: 127.0.0.1:8080
  read_timeout: 15s
  write_timeout: 30s

python_engine:
  base_url: http://127.0.0.1:8091
  startup_timeout: 20s
  request_timeout: 30s
  job_poll_interval: 500ms

storage:
  data_root: ./trading-data
  tmp_retention_hours: 24
  parquet_row_group_size: 32768

import:
  source_directory: history
  default_encoding: GB18030
  fail_on_duplicate_timestamp: true
  keep_zero_volume_bars: true
  fill_missing_bars: false

chart:
  initial_instrument: AOL9
  begin_dt: "2026-04-27 11:30:00"
  end_dt: "2026-07-24 21:50:00"
  initial_bars: 3000
  prefetch_bars: 1500
  max_bars_per_request: 5000
  prefetch_screen_threshold: 1.0
  zoom_debounce_ms: 150
  one_inflight_history_request: true

workspace:
  default_profile_id: default
  default_layout_id: default-three-pane

logging:
  level: INFO
  format: text
  max_file_bytes: 52428800
  backup_count: 9
  compress_backups: true
  vue_batch_max_events: 100
  vue_batch_interval_ms: 1000
  vue_request_max_bytes: 262144

